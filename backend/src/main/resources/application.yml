spring:
  application:
    name: chatapp-backend

  datasource:
    url: jdbc:h2:file:./data/chatappdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
  web:
    error:
      include-stacktrace: never
      include-message: always

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

server:
  port: ${PORT:8080}

# profile pictures and banners are saved here (relative to where the backend runs)
app:
  upload-dir: ${UPLOAD_DIR:uploads}

chatapp:
  jwt:
    secret: ${CHATAPP_JWT_SECRET:change-me-in-production-4f8b2c1d9e7a6f3b5c8d0e2f4a6b8c0d1e3f5a7b9c1d3e5f7a9b1c3d5e7f9a1b}
    expiration-minutes: 1440
    issuer: chatapp
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173}
  seed-demo-data: true

logging:
  level:
    com.chatapp: INFO
    org.springframework.security: WARN